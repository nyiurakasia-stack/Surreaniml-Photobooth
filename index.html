<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maleo Receipt Photobooth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flashOverlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease-in-out;
            z-index: 9999;
        }

        .viewport-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .booth-interface {
            display: flex;
            background: #141414;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .viewfinder {
            flex: 7;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #countdownOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 110px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 100;
        }

        .control-panel {
            flex: 3;
            background: #1a1a1a;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-left: 2px solid #2a2a2a;
            text-align: center;
        }

        .brand-header {
            margin-top: 10px;
        }

        .brand-title {
            color: #ff3838;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Branding Teks Baru di Atas Tombol */
        .btn-brand-label {
            color: #ff4d4d;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .button-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-trigger {
            width: 100%;
            max-width: 240px;
            padding: 20px 15px;
            font-size: 16px;
            font-weight: 900;
            font-family: inherit;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #ff4d4d, #d63031);
            color: #ffffff;
            border: 2px solid #ff7675;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-trigger:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.4);
        }

        .btn-trigger:disabled {
            background: #333;
            border-color: #444;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        .footer-note {
            font-size: 10px;
            color: #555;
            margin-bottom: 5px;
        }

        /* PERBAIKAN ORIENTASI HP: Memutar Seluruh Viewport & Kamera 90 Derajat */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            .viewport-wrapper {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: top left;
                position: absolute;
                top: 0;
                left: 100vw;
            }

            /* Memutar elemen video agar preview kamera pas melintang landscape */
            video {
                transform: rotate(-90deg);
                transform-origin: center;
                width: 100vh;
                height: 100vw;
                object-fit: cover;
            }
        }

        #receiptSection {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            z-index: 5000;
            overflow-y: auto;
        }

        .receipt-card {
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .receipt-card canvas {
            background: #fff;
            margin: 12px 0;
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }

        .btn-save {
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="flashOverlay"></div>

    <div class="viewport-wrapper">
        <div class="booth-interface">
            <div class="viewfinder">
                <video id="camera" autoplay playsinline muted></video>
                <div id="countdownOverlay">3</div>
            </div>

            <div class="control-panel">
                <div class="brand-header">
                    <p class="brand-title">Maleo</p>
                    <p class="brand-sub">RECEIPT PHOTOBOOTH</p>
                </div>

                <div class="button-container">
                    <div class="btn-brand-label">MALEO FOTO</div>
                    <button id="snapBtn" class="btn-trigger" onclick="startPhotoSession()" disabled>MEMBUKA...</button>
                </div>

                <div class="footer-note">
                    YOGYAKARTA • HD CAMERA
                </div>
            </div>
        </div>
    </div>

    <div id="receiptSection">
        <div class="receipt-card">
            <canvas id="resultCanvas" width="384" height="780"></canvas>
            <button class="btn-save" onclick="downloadFullReceipt()">SIMPAN / CETAK STRUK</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const snapBtn = document.getElementById('snapBtn');
        const receiptSection = document.getElementById('receiptSection');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const flashOverlay = document.getElementById('flashOverlay');
        
        let capturedImages = [];
        let currentDateStr = new Date().toLocaleDateString('id-ID', {
            day: '2-digit', month: '2-digit', year: 'numeric'
        });

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                snapBtn.innerText = "AMBIL FOTO";
                snapBtn.disabled = false;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    snapBtn.innerText = "AMBIL FOTO";
                    snapBtn.disabled = false;
                } catch (e) {
                    snapBtn.innerText = "KAMERA ERROR";
                    alert("Tidak dapat mengakses kamera.");
                }
            }
        }

        initCamera();

        async function triggerFlash() {
            flashOverlay.style.opacity = '1';
            await new Promise(r => setTimeout(r, 120));
            flashOverlay.style.opacity = '0';
        }

        async function startPhotoSession() {
            capturedImages = [];
            snapBtn.disabled = true;
            receiptSection.style.display = 'none';
            countdownOverlay.style.display = 'flex';

            for (let i = 1; i <= 3; i++) {
                snapBtn.innerText = `POSE ${i} / 3`;
                
                for (let c = 3; c > 0; c--) {
                    countdownOverlay.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }

                countdownOverlay.innerText = "📸";
                await triggerFlash(); 
                await new Promise(r => setTimeout(r, 200));

                let tempCanvas = document.createElement('canvas');
                let vWidth = video.videoWidth || 640;
                let vHeight = video.videoHeight || 480;
                
                let tCtx = tempCanvas.getContext('2d');
                tempCanvas.width = 664;
                tempCanvas.height = 400;

                if (vHeight > vWidth) {
                    tCtx.save();
                    tCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
                    tCtx.rotate(Math.PI / 2);
                    
                    let targetRatio = 400 / 664;
                    let cropH = vHeight;
                    let cropW = vHeight * targetRatio;
                    if (cropW > vWidth) {
                        cropW = vWidth;
                        cropH = vWidth / targetRatio;
                    }
                    let cropX = (vWidth - cropW) / 2;
                    let cropY = (vHeight - cropH) / 2;

                    tCtx.drawImage(video, cropX, cropY, cropW, cropH, -tempCanvas.height / 2, -tempCanvas.width / 2, tempCanvas.height, tempCanvas.width);
                    tCtx.restore();
                } else {
                    let targetRatio = 332 / 200;
                    let cropW = vWidth;
                    let cropH = vWidth / targetRatio;
                    if (cropH > vHeight) {
                        cropH = vHeight;
                        cropW = vHeight * targetRatio;
                    }
                    let cropX = (vWidth - cropW) / 2;
                    let cropY = (vHeight - cropH) / 2;

                    tCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, tempCanvas.width, tempCanvas.height);
                }

                capturedImages.push(tempCanvas);
            }

            countdownOverlay.style.display = 'none';
            snapBtn.innerText = "AMBIL FOTO";
            snapBtn.disabled = false;
            generateReceiptLayout();
        }

        function generateReceiptLayout() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#000000";
            ctx.textAlign = "center";

            // 1. Maleo Receipt
            ctx.font = "bold 20px 'Courier New', monospace";
            ctx.fillText("Maleo Receipt", canvas.width / 2, 40);

            // 2. Foto Struk Pertama di Jogja
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.fillText("Foto Struk Pertama di Jogja", canvas.width / 2, 65);

            // 3. Tanggal
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.fillText("Tanggal: " + currentDateStr, canvas.width / 2, 88);

            // Garis Pembatas
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(15, 105);
            ctx.lineTo(canvas.width - 15, 105);
            ctx.stroke();
            ctx.setLineDash([]);

            // 4. Render 3 Foto Pose
            let yPos = 120;
            capturedImages.forEach((img) => {
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 2;
                ctx.strokeRect(24, yPos - 2, 336, 184);

                ctx.drawImage(img, 0, 0, img.width, img.height, 26, yPos, 332, 180);
                yPos += 195;
            });

            // Garis Pembatas Bawah
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(15, yPos + 10);
            ctx.lineTo(canvas.width - 15, yPos + 10);
            ctx.stroke();
            ctx.setLineDash([]);

            // 5. Made In Yogyakarta
            ctx.font = "bold 15px 'Courier New', monospace";
            ctx.fillText("Made In Yogyakarta", canvas.width / 2, yPos + 40);

            // Grayscale Alami
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let gray = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                data[i]     = gray;
                data[i + 1] = gray;
                data[i + 2] = gray;
            }
            ctx.putImageData(imgData, 0, 0);

            receiptSection.style.display = 'flex';
        }

        function downloadFullReceipt() {
            let link = document.createElement('a');
            link.download = 'maleo-receipt-photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
