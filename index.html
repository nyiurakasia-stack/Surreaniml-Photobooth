<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surreaniml Receipt Photobooth (3 Pose)</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { background-color: #555; }
        .receipt-card {
            width: 100%;
            background-color: #fff;
            color: #000;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .receipt-card canvas {
            background: #fff;
            margin: 10px 0;
            height: auto;
            max-width: 100%;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📸 Surreaniml Receipt Photobooth</h2>
        
        <!-- Tampilan Kamera -->
        <video id="camera" autoplay playsinline></video>
        <button id="snapBtn" onclick="startPhotoSession()">AMBIL FOTO (3 Pose)</button>

        <!-- Hasil Struk Foto -->
        <div id="receiptSection" class="receipt-card">
            <h3>--- SURREANIML RECEIPT ---</h3>
            <p style="font-size: 11px; margin: 2px 0; font-weight: bold;">Foto Struk Pertama di jogja</p>
            <p style="font-size: 12px; margin-top: 8px;">Tanggal: <span id="dateNow"></span></p>
            <hr style="border-top: 1px dashed #000;">
            
            <!-- Tempat Gabungan 3 Foto (Lebar 384px, Tinggi Kompak 680px) -->
            <canvas id="resultCanvas" width="384" height="680"></canvas>
            
            <hr style="border-top: 1px dashed #000;">
            <div style="font-size: 11px; margin-top: 10px; font-weight: bold; line-height: 1.4;">
                <p style="margin: 2px 0;">Made In Yogyakarta</p>
                <p style="margin: 2px 0;">Creatures Make Culture</p>
            </div>
            
            <button style="background-color: #2ed573;" onclick="downloadFullReceipt()">SIMPAN / CETAK STRUK</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const snapBtn = document.getElementById('snapBtn');
        const receiptSection = document.getElementById('receiptSection');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        
        let capturedImages = [];
        let currentDateStr = new Date().toLocaleDateString('id-ID');

        document.getElementById('dateNow').innerText = currentDateStr;

        // Nyalakan Kamera (Mendukung Webcam Eksternal/OTG atau Kamera HP)
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }, 
            audio: false 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => alert("Gagal mengakses kamera: " + err));

        // Fungsi Ambil 3 Foto Beruntun
        async function startPhotoSession() {
            capturedImages = [];
            snapBtn.disabled = true;

            for (let i = 1; i <= 3; i++) {
                snapBtn.innerText = `Bersiap... Foto ke-${i} dari 3`;
                await new Promise(r => setTimeout(r, 2500));

                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth || 1280;
                tempCanvas.height = video.videoHeight || 720;
                let tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                
                capturedImages.push(tempCanvas);
            }

            snapBtn.innerText = "AMBIL FOTO (3 Pose)";
            snapBtn.disabled = false;
            generateReceiptLayout();
        }

        // Bingkai Surealis Disesuaikan untuk 3 Foto
        function drawSurreanimlFrame() {
            ctx.strokeStyle = "#000000";
            ctx.fillStyle = "#000000";
            ctx.lineWidth = 2;

            // Bingkai Luar
            ctx.beginPath();
            ctx.rect(8, 8, canvas.width - 16, canvas.height - 16);
            ctx.stroke();

            // Ornaments Sudut
            ctx.beginPath();
            ctx.arc(24, 24, 7, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width - 24, 24, 7, 0, Math.PI * 2);
            ctx.stroke();

            // Ornamen Samping untuk 3 Foto
            let sideYPositions = [120, 330, 540];
            sideYPositions.forEach(y => {
                ctx.beginPath();
                ctx.ellipse(13, y, 6, 3, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(canvas.width - 8, y - 5);
                ctx.lineTo(canvas.width - 15, y);
                ctx.lineTo(canvas.width - 8, y + 5);
                ctx.stroke();
            });
        }

        // Fungsi Helper untuk Gambar dengan Konsep Cover (Fixed & Tidak Tarik-tarik)
        function drawImageCover(context, img, x, y, w, h) {
            let imgRatio = img.width / img.height;
            let targetRatio = w / h;
            let renderW, renderH, offsetX, offsetY;

            if (imgRatio > targetRatio) {
                renderH = h;
                renderW = img.width * (h / img.height);
                offsetX = (w - renderW) / 2;
                offsetY = 0;
            } else {
                renderW = w;
                renderH = img.height * (w / img.width);
                offsetX = 0;
                offsetY = (h - renderH) / 2;
            }

            context.save();
            context.beginPath();
            context.rect(x, y, w, h);
            context.clip();
            context.drawImage(img, x + offsetX, y + offsetY, renderW, renderH);
            context.restore();
        }

        function generateReceiptLayout() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawSurreanimlFrame();

            // Layout 3 Foto (Ukuran Frame Kotak: 336 x 200 px)
            let yPos = 30;
            capturedImages.forEach((img) => {
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 1;
                ctx.strokeRect(24, yPos - 2, 336, 204);
                
                // Menggunakan sistem Cover agar proporsional dan tidak gepeng
                drawImageCover(ctx, img, 26, yPos, 332, 200);
                
                yPos += 215; 
            });

            // Grayscale Alami
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                data[i]     = avg;
                data[i + 1] = avg;
                data[i + 2] = avg;
            }
            ctx.putImageData(imgData, 0, 0);

            receiptSection.style.display = 'block';
            receiptSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Unduh Struk Utuh 3 Pose (Thermal 58mm)
        function downloadFullReceipt() {
            let masterCanvas = document.createElement('canvas');
            masterCanvas.width = 384;
            masterCanvas.height = 950;
            let mCtx = masterCanvas.getContext('2d');

            mCtx.fillStyle = "#ffffff";
            mCtx.fillRect(0, 0, masterCanvas.width, masterCanvas.height);

            // Header
            mCtx.fillStyle = "#000000";
            mCtx.font = "bold 15px 'Courier New', monospace";
            mCtx.textAlign = "center";
            mCtx.fillText("--- SURREANIML RECEIPT ---", masterCanvas.width / 2, 35);

            // Tambahan Kalimat
            mCtx.font = "bold 11px 'Courier New', monospace";
            mCtx.fillText("Foto Struk Pertama di jogja", masterCanvas.width / 2, 55);

            mCtx.font = "12px 'Courier New', monospace";
            mCtx.fillText("Tanggal: " + currentDateStr, masterCanvas.width / 2, 78);

            mCtx.setLineDash([4, 4]);
            mCtx.beginPath();
            mCtx.moveTo(20, 95);
            mCtx.lineTo(364, 95);
            mCtx.stroke();
            mCtx.setLineDash([]);

            // Kanvas Foto (3 Pose)
            mCtx.drawImage(canvas, 0, 110);

            mCtx.setLineDash([4, 4]);
            mCtx.beginPath();
            mCtx.moveTo(20, 820);
            mCtx.lineTo(364, 820);
            mCtx.stroke();
            mCtx.setLineDash([]);

            // Footer
            mCtx.font = "bold 12px 'Courier New', monospace";
            mCtx.fillText("Made In Yogyakarta", masterCanvas.width / 2, 860);
            mCtx.fillText("Creatures Make Culture", masterCanvas.width / 2, 880);

            let link = document.createElement('a');
            link.download = 'surreaniml-3pose-receipt.png';
            link.href = masterCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
