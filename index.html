<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surreaniml Receipt Photobooth</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 360px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 2px 2px 10px #000;
            display: none;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { background-color: #555; }
        .receipt-card {
            width: 100%;
            background-color: #fff;
            color: #000;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .receipt-card canvas {
            background: #fff;
            margin: 10px 0;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📸 Surreaniml Receipt</h2>
        
        <div class="video-wrapper">
            <video id="camera" autoplay playsinline muted></video>
            <div id="countdownOverlay">3</div>
        </div>

        <button id="snapBtn" onclick="startPhotoSession()" disabled>MEMBUKA KAMERA...</button>

        <div id="receiptSection" class="receipt-card">
            <h3>--- SURREANIML RECEIPT ---</h3>
            <p style="font-size: 11px; margin: 2px 0; font-weight: bold;">Foto Struk Pertama di Jogja</p>
            <p style="font-size: 12px; margin-top: 8px;">Tanggal: <span id="dateNow"></span></p>
            <hr style="border-top: 1px dashed #000;">
            
            <canvas id="resultCanvas" width="384" height="760"></canvas>
            
            <hr style="border-top: 1px dashed #000;">
            <div style="font-size: 11px; margin-top: 10px; font-weight: bold; line-height: 1.4;">
                <p style="margin: 2px 0;">Made In Yogyakarta</p>
                <p style="margin: 2px 0;">Creatures Make Culture</p>
            </div>
            
            <button style="background-color: #2ed573;" onclick="downloadFullReceipt()">SIMPAN / CETAK STRUK</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const snapBtn = document.getElementById('snapBtn');
        const receiptSection = document.getElementById('receiptSection');
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');
        const countdownOverlay = document.getElementById('countdownOverlay');
        
        let capturedImages = [];
        let currentDateStr = new Date().toLocaleDateString('id-ID');
        document.getElementById('dateNow').innerText = currentDateStr;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                video.srcObject = stream;
                snapBtn.innerText = "AMBIL FOTO (3 Pose)";
                snapBtn.disabled = false;
            } catch (err) {
                snapBtn.innerText = "IZIN KAMERA DIBLOKIR";
                alert("Mohon izinkan akses kamera pada browser Anda.");
            }
        }

        initCamera();

        async function startPhotoSession() {
            capturedImages = [];
            snapBtn.disabled = true;
            receiptSection.style.display = 'none';
            countdownOverlay.style.display = 'flex';

            for (let i = 1; i <= 3; i++) {
                snapBtn.innerText = `Mengambil Pose ${i} dari 3...`;
                
                for (let c = 3; c > 0; c--) {
                    countdownOverlay.innerText = c;
                    await new Promise(r => setTimeout(r, 1000));
                }

                countdownOverlay.innerText = "📸";
                await new Promise(r => setTimeout(r, 400));

                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth || 640;
                tempCanvas.height = video.videoHeight || 480;
                let tCtx = tempCanvas.getContext('2d');
                
                tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                capturedImages.push(tempCanvas);
            }

            countdownOverlay.style.display = 'none';
            snapBtn.innerText = "AMBIL FOTO (3 Pose)";
            snapBtn.disabled = false;
            generateReceiptLayout();
        }

        function drawSurreanimlMasterFrame() {
            ctx.strokeStyle = "#000000";
            ctx.fillStyle = "#000000";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.rect(8, 8, canvas.width - 16, canvas.height - 16);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(24, 24, 6, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width - 24, 24, 6, 0, Math.PI * 2);
            ctx.stroke();
        }

        function generateReceiptLayout() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawSurreanimlMasterFrame();

            let yPos = 35;
            
            capturedImages.forEach((img) => {
                let imgW = img.width;
                let imgH = img.height;
                let imgRatio = imgW / imgH;

                let maxW = 332;
                let maxH = 210;

                let drawW = maxW;
                let drawH = maxW / imgRatio;

                if (drawH > maxH) {
                    drawH = maxH;
                    drawW = maxH * imgRatio;
                }

                let drawX = 26 + (maxW - drawW) / 2;
                let drawY = yPos;

                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(drawX - 4, drawY - 4, drawW + 8, drawH + 8);

                let midY = drawY + (drawH / 2);
                ctx.beginPath();
                ctx.ellipse(drawX - 7, midY, 4, 2, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(drawX + drawW + 7, midY - 3);
                ctx.lineTo(drawX + drawW + 3, midY);
                ctx.lineTo(drawX + drawW + 7, midY + 3);
                ctx.stroke();

                ctx.drawImage(img, 0, 0, imgW, imgH, drawX, drawY, drawW, drawH);

                yPos += drawH + 30;
            });

            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                data[i]     = avg;
                data[i + 1] = avg;
                data[i + 2] = avg;
            }
            ctx.putImageData(imgData, 0, 0);

            receiptSection.style.display = 'block';
            receiptSection.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadFullReceipt() {
            let masterCanvas = document.createElement('canvas');
            masterCanvas.width = 384;
            masterCanvas.height = 850;
            let mCtx = masterCanvas.getContext('2d');

            mCtx.fillStyle = "#ffffff";
            mCtx.fillRect(0, 0, masterCanvas.width, masterCanvas.height);

            mCtx.fillStyle = "#000000";
            mCtx.font = "bold 15px 'Courier New', monospace";
            mCtx.textAlign = "center";
            mCtx.fillText("--- SURREANIML RECEIPT ---", masterCanvas.width / 2, 35);

            mCtx.font = "bold 11px 'Courier New', monospace";
            mCtx.fillText("Foto Struk Pertama di Jogja", masterCanvas.width / 2, 55);

            mCtx.font = "12px 'Courier New', monospace";
            mCtx.fillText("Tanggal: " + currentDateStr, masterCanvas.width / 2, 78);

            mCtx.setLineDash([4, 4]);
            mCtx.beginPath();
            mCtx.moveTo(20, 95);
            mCtx.lineTo(364, 95);
            mCtx.stroke();
            mCtx.setLineDash([]);

            mCtx.drawImage(canvas, 0, 110);

            mCtx.setLineDash([4, 4]);
            mCtx.beginPath();
            mCtx.moveTo(20, 750);
            mCtx.lineTo(364, 750);
            mCtx.stroke();
            mCtx.setLineDash([]);

            mCtx.font = "bold 12px 'Courier New', monospace";
            mCtx.fillText("Made In Yogyakarta", masterCanvas.width / 2, 790);
            mCtx.fillText("Creatures Make Culture", masterCanvas.width / 2, 810);

            let link = document.createElement('a');
            link.download = 'surreaniml-3pose-receipt.png';
            link.href = masterCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
